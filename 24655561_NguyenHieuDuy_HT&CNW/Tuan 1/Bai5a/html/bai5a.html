<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Movie Day Table</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: "Times New Roman", Times, serif;
            background-color: #fff;
            margin: 10px;
        }
        th, td {
            border: 3px double #888;
            padding: 6px 12px;
            text-align: left;
            vertical-align: middle;
        }
        .title-header {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            padding: 8px;
        }
        .time-header {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .screen-col {
            font-weight: bold;
            text-align: center;
            width: 80px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="5" class="title-header">Classic Movie Day</th>
        </tr>
        <tr class="time-header">
            <td></td>
            <td>5 pm</td>
            <td>7 pm</td>
            <td>9 pm</td>
            <td>11 pm</td>
        </tr>
        <tr>
            <td class="screen-col">Screen<br>one</td>
            <td>Star Wars</td>
            <td>Empire Strikes<br>Back</td>
            <td>Return of the Jedi</td>
            <td>The Exorcist</td>
        </tr>
        <tr>
            <td class="screen-col">Screen<br>two</td>
            <td colspan="2">Dances with Wolves</td>
            <td colspan="2">Gone With the Wind</td>
        </tr>
        <tr>
            <td class="screen-col">Screen<br>three</td>
            <td colspan="2">2001: A Space Odyssey</td>
            <td>The Conversation</td>
            <td>5 Easy Pieces</td>
        </tr>
    </table>

</body>
</html>
